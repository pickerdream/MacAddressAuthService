services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - production-postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: ghcr.io/pickerdream/mac-address-auth-service:latest
    restart: unless-stopped
    command: sh -c "npm run migrate && npm run seed && npm run start"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      RADIUS_MAC_FORMAT: ${RADIUS_MAC_FORMAT:-colon}
      # SSO (SAML 2.0) Configuration
      # SAML_ENTRY_POINT: ${SAML_ENTRY_POINT}
      # SAML_ISSUER: ${SAML_ISSUER}
      # SAML_CERT: ${SAML_CERT}
      # SAML_CALLBACK_URL: ${SAML_CALLBACK_URL}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  internal:
    driver: bridge

volumes:
  production-postgres-data:
