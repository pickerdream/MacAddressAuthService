services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: macauth
      POSTGRES_USER: macauth
      POSTGRES_PASSWORD: macauth_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macauth -d macauth"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - macauth-net

  app:
    build: .
    command: sh -c "npm install && npm run migrate && npm run seed && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://macauth:macauth_dev_password@postgres:5432/macauth
      SESSION_SECRET: development-only-change-this-secret
      SAML_ENTRY_POINT: http://localhost:8080/simplesaml/saml2/idp/SSOService.php
      SAML_ISSUER: mac-auth-service
      SAML_CERT: ""
      SAML_CALLBACK_URL: http://localhost:3000/auth/saml/callback
      RADIUS_MAC_FORMAT: colon
      ADMIN_EMAIL: admin@example.local
      ADMIN_PASSWORD: ChangeMe123!
      ADMIN_NAME: Local Administrator
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - macauth-net

  saml-idp:
    image: kristophjunge/test-saml-idp
    ports:
      - "8080:8080"
    environment:
      SIMPLESAMLPHP_SP_ENTITY_ID: mac-auth-service
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: http://localhost:3000/auth/saml/callback
    networks:
      - macauth-net

networks:
  macauth-net:

volumes:
  postgres-data:
  app-node-modules:
